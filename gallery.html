<!doctype html><html lang="ko"><head><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23325d4b%22/%3E%3Ctext x=%2232%22 y=%2247%22 text-anchor=%22middle%22 font-size=%2245%22 fill=%22%23e9c68b%22%3E✦%3C/text%3E%3C/svg%3E"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 갤러리 · ART JOB CITY</title><link rel="stylesheet" href="furniture/studio.css"><style>.gallery{max-width:1400px;margin:auto;padding:60px 30px}.gallery h1{font-size:44px;letter-spacing:-2px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;margin-top:35px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;overflow:hidden}.card img{width:100%;aspect-ratio:1;object-fit:contain;background:#f2ede4}.card div{padding:20px}.card h2{font-size:20px;margin:0 0 10px}.card p{font-size:12px;color:#7c8779}.card button{margin:5px}.empty{padding:70px 0;line-height:2}.empty a{color:#325d4b;text-decoration:underline}</style></head><body><header class="header"><a class="logo" href="index.html">ART JOB CITY<small>DESIGN YOUR FUTURE</small></a><nav class="nav"><a href="index.html">← 도시로 돌아가기</a><a href="furniture/index.html">새 의자 디자인 ↗</a></nav></header><main class="gallery"><div class="eyebrow">MY CREATIVE COLLECTION</div><h1>상상이 작품으로.</h1><p class="sub">내가 만든 디자인과 다섯 가지 가능성. 작품은 현재 브라우저에 보관됩니다.</p><div id="collection" class="grid"></div><p id="message" role="status"></p></main><script src="storage.js"></script><script>
const jobs=['','가구 디자이너','게임 캐릭터 디자이너','공간 디자이너','전시 기획자','패션 디자이너'];
function render(){const box=document.getElementById('collection');box.replaceChildren();const works=ArtStore.works();if(!works.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='아직 전시된 작품이 없어요. 첫 번째 의자를 디자인해 보세요.';box.append(empty);return}for(const w of works.slice().reverse()){const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.src=w.image;img.alt=w.name||'나의 작품';const details=document.createElement('div');const title=document.createElement('h2');title.textContent=w.name;const meta=document.createElement('p');meta.textContent=(jobs[w.job]||'디자인')+' · '+new Date(w.createdAt).toLocaleDateString('ko-KR');const download=document.createElement('button');download.className='secondary';download.textContent='PNG 다운로드';download.onclick=()=>ArtStore.download(w.image,w.name);const edit=document.createElement('button');edit.className='secondary';edit.textContent='이어서 디자인';edit.onclick=()=>{const key=w.job===1?'chairStudio':'artjob_studio_'+w.job;if(!ArtStore.setItem(key,JSON.stringify(w.design))){document.getElementById('message').textContent='브라우저 저장을 허용해 주세요.';return}if(w.mission&&Array.isArray(w.mission.checks))ArtStore.setItem('artjob_brief_checks_v1_'+w.job,JSON.stringify(w.mission.checks));location.href=w.job===1?'furniture/index.html':'creative.html?job='+w.job};const remove=document.createElement('button');remove.className='secondary';remove.textContent='삭제';remove.onclick=()=>{if(confirm('이 작품을 갤러리에서 삭제할까요? PNG 파일은 먼저 내려받아 주세요.')){if(ArtStore.setItem('artjob_works',JSON.stringify(ArtStore.works().filter(x=>x.id!==w.id))))render();else document.getElementById('message').textContent='삭제 내용을 저장하지 못했습니다.'}};if(w.project){const stage=document.createElement('p');stage.textContent=w.project.submitted?'프로젝트 제출 완료 · 시안 비교와 설계 기록 포함':'작품 초안 · 프로젝트 기록 작성 중';details.append(stage)}if(w.creator&&typeof w.creator.name==='string'){const author=document.createElement('p');author.textContent='DESIGNED BY '+w.creator.name;details.append(author)}if(w.mission&&typeof w.mission.title==='string'){const mission=document.createElement('p');mission.textContent='의뢰 · '+w.mission.title;details.append(mission)}details.append(title,meta,download,edit,remove);card.append(img,details);box.append(card)}}render();
</script></body></html>
