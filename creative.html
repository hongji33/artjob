<!doctype html><html lang="ko"><head><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23325d4b%22/%3E%3Ctext x=%2232%22 y=%2247%22 text-anchor=%22middle%22 font-size=%2245%22 fill=%22%23e9c68b%22%3E✦%3C/text%3E%3C/svg%3E"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>디자인 스튜디오 · ART JOB CITY</title><link rel="stylesheet" href="furniture/studio.css"><style>.stage{display:grid;place-items:center;min-height:680px;padding:30px;background:radial-gradient(ellipse,#fffaf3,#e6e7de)}#artboard{width:100%;max-width:900px;aspect-ratio:1.1;filter:drop-shadow(0 20px 28px #30403215)}.stage-wrap{min-width:0}.stage-header{padding:25px 30px;font-size:24px;letter-spacing:-1px}.side select{width:100%;padding:12px;border:1px solid #daddcf;border-radius:7px;color:#325d4b;background:white}.side label{display:block;font-size:12px;line-height:2;margin:20px 0}.side input[type=range]{width:100%;accent-color:#325d4b}#artboard>svg{width:100%;height:100%}.app{grid-template-columns:270px minmax(0,1fr) 260px}@media(max-width:1150px){.app{grid-template-columns:240px minmax(0,1fr)}}@media(max-width:650px){.stage{min-height:390px;padding:10px}.stage-wrap{order:0}}</style></head><body><header class="header"><a class="logo" href="index.html">ART JOB CITY<small>DESIGN YOUR FUTURE</small></a><nav class="nav"><a href="index.html">← 도시로 돌아가기</a><a href="gallery.html">나의 갤러리 ↗</a></nav></header><div class="app"><aside class="side"><div class="eyebrow" id="jobLabel"></div><h1 id="jobTitle"></h1><p class="sub" id="brief"></p><div id="tools"></div><label>주조색 <input type="color" id="mainColor"></label><label>강조색 <input type="color" id="accentColor"></label><label>배경색 <input type="color" id="bgColor"></label><label id="sizeLabel">비례 조절<input type="range" id="scale" min="75" max="120"></label></aside><main class="stage-wrap"><div class="stage-header" id="stageTitle"></div><div class="stage"><div id="artboard" aria-label="실시간 디자인 미리보기"></div></div></main><aside class="info"><div class="eyebrow">YOUR DESIGN NOTES</div><h2>나만의 시각 언어</h2><p class="sub" id="advice"></p><label class="sub">작품 이름<input type="text" id="name" maxlength="40"></label><label class="sub">기획 의도<textarea id="description" class="note" rows="5" maxlength="180"></textarea></label><div id="status" class="status" role="status">형태와 색, 비례를 바꾸며 나만의 작품을 만들어 보세요.</div><div><button class="primary" id="finish">작품 완성 · 갤러리 저장 ↗</button><div class="actions"><button class="secondary" id="download">PNG 다운로드</button><button class="secondary" id="reset">초기화</button></div></div><div class="foot">배치·드로잉·시안 비교로 디자인을 발전시켜 보세요. 작품은 현재 브라우저에 저장됩니다.</div></aside></div><script src="storage.js"></script><script src="illustration.js"></script><script src="creative.js"></script><script src="avatar.js"></script><script src="curriculum.js"></script><script src="brief.js"></script><script src="course.js"></script></body></html>
